[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-biopsy-variant-triage"
version = "0.1.0"
description = "Research prototype for interpretable cfDNA variant triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<2.4"]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<1.9",
    "umap-learn>=0.5.7,<0.6",
    "jupyterlab>=4.3,<5",
    "nbclient>=0.10,<0.11",
]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6"]

[project.scripts]
variant-triage = "liquid_biopsy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
